<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="orbGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2a1a3e"/>
      <stop offset="70%" stop-color="#1a0e2e"/>
      <stop offset="100%" stop-color="#0d0618"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4bfff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#7c3aed" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="78" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
    <circle cx="100" cy="100" r="72" fill="url(#orbGrad)"/>
    <circle cx="100" cy="100" r="72" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  </g>
  <path d="M100 45 L112 88 L155 100 L112 112 L100 155 L88 112 L45 100 L88 88 Z" fill="url(#starGrad)" opacity="0.9"/>
</svg>
